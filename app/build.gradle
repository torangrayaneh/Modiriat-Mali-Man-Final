plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.modiriatmaliman'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.modiriatmaliman'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // Keep Java bytecode target aligned with Kotlin (JVM 17).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependencies {
        implementation 'androidx.biometric:biometric:1.1.0'
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
